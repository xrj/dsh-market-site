name: 每日构建并部署 DSH 插件集市

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC；19:30 UTC 约为北京时间次日 03:30。
    - cron: "30 19 * * *"

# 只授予更新目录基线所需的仓库写权限，部署凭据通过 Secrets 单独提供。
permissions:
  contents: write

# 防止手动触发和定时任务同时构建并覆盖同一份目录快照。
concurrency:
  group: dsh-market-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://dsh-market.pages.dev
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 检出主站源码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 配置 Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 检查 GitHub 数据源配额
        run: gh api rate_limit --jq '.resources.core | "GitHub API 剩余请求：\(.remaining)"'

      - name: 保存构建前目录快照
        run: cp site/data.json "$RUNNER_TEMP/dsh-data-before.json"

      - name: 抓取并构建静态站
        run: python build.py --fetch

      - name: 校验目录和静态产物
        run: python scripts/validate_build.py --before "$RUNNER_TEMP/dsh-data-before.json"

      - name: 判断目录是否有实质变化
        id: snapshot
        run: |
          if python scripts/snapshot_changed.py --before "$RUNNER_TEMP/dsh-data-before.json" --current site/data.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 持久化有效目录基线
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git commit -m "chore: refresh catalog snapshot"
          git push origin HEAD:main

      - name: 检查 Cloudflare Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "缺少 CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "缺少 CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 pages deploy site --project-name dsh-market

      - name: 检查线上生产站
        run: python scripts/smoke_test.py --site-url "$SITE_URL"

      - name: 保留本次构建报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dsh-market-build-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            site/update-report.json
            site/data.json
